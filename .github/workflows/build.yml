name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
      BUILDOZER_WARN_ON_ROOT: "0"
      ANDROIDAPI: "33"
      ANDROIDNDKVER: "25b"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Cache Buildozer and Android SDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-py310-ndk25b-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-py310-ndk25b-

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            unzip \
            zip \
            wget \
            curl \
            openjdk-17-jdk \
            python3-pip \
            python3-setuptools \
            python3-venv \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            ninja-build \
            patchelf \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            gettext \
            build-essential \
            ccache \
            libgl1-mesa-dev \
            libgles2-mesa-dev

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install \
            "Cython==0.29.36" \
            "setuptools==69.5.1" \
            "virtualenv" \
            "buildozer==1.5.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build debug APK with Buildozer
        run: python -m buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: samsung-notes-companion-apk
          path: bin/*.apk
          if-no-files-found: error
